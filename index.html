<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#18271f"><link rel="icon" href="data:,"><title>喫茶 余白 — 歩いて、手にとる</title><style>
:root{--cream:#ece2cb;--forest:#18271f;--brass:#ae9867}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--forest);color:var(--cream);font-family:serif}canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}#loading{position:fixed;inset:0;display:grid;place-content:center;gap:18px;text-align:center;background:radial-gradient(ellipse at 50% 40%,#344238,#17261f);transition:opacity .5s}h1{font-size:clamp(24px,5vw,38px);font-weight:400;letter-spacing:.22em;margin:0}p{margin:0;opacity:.72;font-size:14px;letter-spacing:.08em}progress{width:240px;height:3px;border:0;appearance:none;background:#4b5144;margin:auto}progress::-webkit-progress-bar{background:#4b5144}progress::-webkit-progress-value{background:var(--brass)}#error{font-family:sans-serif;max-width:500px;white-space:pre-wrap;font-size:14px;line-height:1.7;padding:20px}
</style></head><body><canvas id="canvas" tabindex="0" aria-label="喫茶 余白。WASDで歩き、ドラッグで見回し、Eで手にとります。"></canvas><div id="loading"><h1>喫茶 余白</h1><p>歩いて、三つの品を手にとる</p><progress id="progress"></progress><p id="status">読み込み中</p><div id="error" hidden></div></div><script src="wasm-gzip-adapter.js"></script><script src="index.js"></script><script>
const cfg={args:[],canvas:document.getElementById('canvas'),canvasResizePolicy:2,executable:'index',focusCanvas:true,experimentalVK:false,gdextensionLibs:[],fileSizes:{'index.wasm':37700666,'index.pck':11164112}};
const engine=new Engine(cfg); const missing=Engine.getMissingFeatures({threads:false});
function failure(e){document.getElementById('status').textContent='起動できませんでした';document.getElementById('progress').hidden=true;const node=document.getElementById('error');node.hidden=false;node.textContent=String(e)+'\nWebGL 2に対応したブラウザで、HTTPサーバーから開いてください。';console.error(e)}
if(missing.length)failure(missing.join('\n'));else engine.startGame({onProgress:(n,total)=>{const p=document.getElementById('progress');if(total>0){p.max=total;p.value=n}}}).then(()=>{document.getElementById('loading').remove();document.getElementById('canvas').focus();window.cafeBooted=true}).catch(failure);
</script></body></html>
